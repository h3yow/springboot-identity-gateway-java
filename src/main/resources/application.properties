# 身份认证网关本地配置
spring.application.name=springboot-identity-gateway-java

# 连续失败锁定阈值与锁定时长（毫秒），窗口到期自动恢复
auth.max-failures=5
auth.lock-millis=300000

# 一次性动态验证码有效期（毫秒）
auth.otp-ttl-millis=300000

# 访问/刷新令牌有效期（毫秒）
auth.access-token-ttl-millis=900000
auth.refresh-token-ttl-millis=604800000

# 单个账号同时有效的最大会话（设备）数量；达到上限后新登录优先淘汰最久未活跃会话。
# 小于等于 0 表示不限制
auth.max-sessions-per-user=5

# HMAC 令牌签名密钥（Base64URL）。本地演示默认值，生产环境必须通过环境变量覆盖
auth.token-signing-key=ZGVmYXVsdC1sb2NhbC1kZXYta2V5LWNoYW5nZS1tZS1wbGVhc2U=

# 本地开发辅助：第一步登录响应中回显 OTP（无短信/邮件渠道时使用）
auth.expose-otp-for-local-dev=true

# 日志：输出认证判定依据
logging.level.com.github.h3yow.springbootidentitygatewayjava=INFO
