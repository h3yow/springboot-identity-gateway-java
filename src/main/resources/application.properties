# ===== 认证与锁定 =====
# 连续失败达到该阈值即临时锁定
auth.max-failures=5
# 锁定时长（秒），窗口到期后自动恢复
auth.lock-seconds=300
# 一次性验证码有效期（秒）
auth.otp-ttl-seconds=300

# ===== 令牌生命周期（秒） =====
auth.access-token-ttl-seconds=900
auth.refresh-token-ttl-seconds=1209600
# 会话绝对上限（秒）：无论刷新多少次，超过即整体失效
auth.session-max-ttl-seconds=86400

# 本地演示：允许 plain: 前缀明文种子密码（生产环境应置为 false 并使用 pbkdf2$... 哈希）
auth.dev-plaintext-passwords=true

# ===== 种子用户（仅本地/测试用，非真实凭据） =====
auth.users[0].username=alice
auth.users[0].password=plain:alice-pw
auth.users[0].roles[0]=user
auth.users[0].scopes[0]=orders:read

auth.users[1].username=bob
auth.users[1].password=plain:bob-pw
auth.users[1].roles[0]=user
auth.users[1].scopes[0]=profile:read

auth.users[2].username=admin
auth.users[2].password=plain:admin-pw
auth.users[2].roles[0]=admin
auth.users[2].roles[1]=user
auth.users[2].scopes[0]=orders:read
auth.users[2].scopes[1]=admin:write
